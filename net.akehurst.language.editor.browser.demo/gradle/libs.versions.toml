[versions]
project = "2.3.21-SNAPSHOT"

kotlin = "2.3.21"
dokka = "2.1.0"
buildconfig = "6.0.7"
exportPublic = "2.3.21-SNAPSHOT"
credentials = "3.0"
compose = "1.11.1"

nal-agl = "4.2.3.21-SNAPSHOT"
nal-editor = "2.3.21-SNAPSHOT"

nak-compose = "2.3.21-SNAPSHOT"
nak-codemirror-editor = "6.0.1"

nak-html-builder = "2.3.21-SNAPSHOT"

compose-material3 = "1.11.0-alpha07"
material = "1.7.3"
compose-navigation = "2.9.2"
kotlinx-coroutines = "1.11.0"

ktor = "3.5.1"
slf4j="2.0.16"

korlibs = "6.0.1"

[libraries]
nal-agl-processor = { module = "net.akehurst.language:agl-processor", version.ref = "nal-agl" }

nak-html-builder = { module = "net.akehurst.kotlin.html5:html-builder", version.ref = "nak-html-builder" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }

nale-agl-editor-browser-worker = {module="net.akehurst.language.editor:agl-editor-browser-worker",version.ref = "nal-editor" }
nale-agl-language-service = {module="net.akehurst.language.editor:agl-language-service",version.ref = "nal-editor" }
nale-agl-editor-browser-agl = {module="net.akehurst.language.editor:agl-editor-browser-agl",version.ref = "nal-editor" }
nale-agl-editor-browser-ace = {module="net.akehurst.language.editor:agl-editor-browser-ace",version.ref = "nal-editor" }
